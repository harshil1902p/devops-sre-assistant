apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-assistant
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
