# The assistant's own infrastructure (separate from the demo "staging" stack it monitors).
#   docker compose -f infra/compose.yaml up -d
name: sre-assistant

services:
  vectordb:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: REMOVED-VECTORDB-PASSWORD
      POSTGRES_DB: sre
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vectordb-data:/var/lib/postgresql/data

  # Least privilege: the Docker socket is root-equivalent. The proxy only allows read-only GETs to the
  # endpoints enabled below (containers, events); every POST/DELETE is rejected with 403.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  event-collector:
    build: ./event-collector
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      EVENTS_DATABASE_URL: postgresql://sre:REMOVED-VECTORDB-PASSWORD@vectordb:5432/sre
    depends_on:
      vectordb:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped

volumes:
  vectordb-data:
