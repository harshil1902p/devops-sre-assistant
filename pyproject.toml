[project]
name = "sre-assistant"
version = "0.1.0"
description = "Intelligent DevOps & SRE Assistant: agentic RAG over runbooks + MCP live-telemetry tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "fastembed>=0.4",
    "onnxruntime<1.20 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "mcp>=2.3,<3",
    "docker>=7.1",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=1.0",
    "azure-identity>=1.19",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "deepeval>=3.0",
    "azure-search-documents>=11.5",
    "azure-monitor-query>=1.4",
    "azure-monitor-ingestion>=1.0",
    "azure-keyvault-secrets>=4.8",
    "fastapi>=0.156.4",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
    "azure-monitor-opentelemetry>=1.8.11",
    "kubernetes>=37.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live services (Ollama, Postgres, Docker)",
]
# -p no:deepeval: deepeval's pytest plugin imports deepeval, which copies .env into os.environ (test leakage).
addopts = "-m 'not integration' -p no:deepeval"

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated data must never be rewritten by a formatter (ruff also formats code blocks inside Markdown).
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown templates: line breaks inside them would change the rendered documents.
"src/sre_assistant/corpus/generate.py" = ["E501"]
"tests/**" = ["E501"]
# Regex pattern tables are easier to review one pattern per line.
"src/sre_assistant/guardrails/injection.py" = ["E501"]
"src/sre_assistant/guardrails/policy.py" = ["E501"]
# Eval case definitions and report formatting are data/presentation heavy.
"src/sre_assistant/evals/cases.py" = ["E501"]
"scripts/run_evals.py" = ["E501", "E731"]
"scripts/setup_entra_app.py" = ["E501"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
