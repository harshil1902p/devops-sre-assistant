[project]
name = "sre-assistant"
version = "0.1.0"
description = "Intelligent DevOps & SRE Assistant: agentic RAG over runbooks + MCP live-telemetry tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "fastembed>=0.4",
    "onnxruntime<1.20 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "mcp>=1.12",
    "docker>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live services (Ollama, Postgres, Docker)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated data must never be rewritten by a formatter (ruff also formats code blocks inside Markdown).
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown templates: line breaks inside them would change the rendered documents.
"src/sre_assistant/corpus/generate.py" = ["E501"]
"tests/**" = ["E501"]
