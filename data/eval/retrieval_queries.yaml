# Hand-written retrieval queries (Phase 2 benchmark; Phase 6 grows this into the full golden set).
# Rules: never copy-paste from the corpus. Log queries use different numbers/hosts/paths;
# symptom queries are phrased the way an on-call engineer would type them.
# `scenario` is the expected answer (see data/corpus/manifest.json for its 3 documents).

- {scenario: db-pool-exhaustion, kind: log, query: "sqlalchemy.exc.TimeoutError: QueuePool limit of size 10 overflow 20 reached, connection timed out, timeout 30.00"}
